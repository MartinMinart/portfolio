<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Артур Минин | Data Analyst / Analytics Engineer</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
            --border: #e2e8f0;
            --placeholder-bg: #f1f5f9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg); color: var(--text); line-height: 1.6; }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        
        /* Header */
        header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 60px 0; text-align: center; }
        header h1 { font-size: 2.5rem; margin-bottom: 10px; color: var(--text); }
        header .subtitle { font-size: 1.25rem; color: var(--primary); font-weight: 600; margin-bottom: 20px; }
        header .summary { max-width: 750px; margin: 0 auto 30px; color: var(--text-light); font-size: 1.1rem; }
        
        /* Portfolio Block in Header */
        .portfolio-hub {
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 20px;
            max-width: 750px;
            margin: 0 auto 30px;
            text-align: left;
        }
        .portfolio-hub h3 { color: var(--primary-dark); font-size: 1.1rem; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .portfolio-hub ul { list-style: none; padding-left: 10px; }
        .portfolio-hub li { margin-bottom: 8px; font-size: 0.95rem; color: var(--text); position: relative; padding-left: 20px; }
        .portfolio-hub li::before { content: '•'; color: var(--primary); font-weight: bold; position: absolute; left: 0; }
        .portfolio-hub a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .portfolio-hub a:hover { text-decoration: underline; }

        .btn { display: inline-block; background: var(--primary); color: white; padding: 12px 24px; border-radius: 6px; text-decoration: none; font-weight: 600; margin: 5px; transition: 0.2s; }
        .btn:hover { background: var(--primary-dark); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-outline:hover { background: var(--primary); color: white; }

        /* Sections */
        section { padding: 60px 0; }
        h2 { font-size: 1.8rem; margin-bottom: 30px; text-align: center; position: relative; }
        h2::after { content: ''; display: block; width: 60px; height: 4px; background: var(--primary); margin: 10px auto 0; border-radius: 2px; }

        /* Cards Grid */
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .project-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 30px; transition: transform 0.2s, box-shadow 0.2s; }
        .project-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .project-tag { display: inline-block; background: #dbeafe; color: var(--primary-dark); padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 15px; }
        .project-card h3 { font-size: 1.3rem; margin-bottom: 15px; }
        .project-card p { color: var(--text-light); margin-bottom: 15px; font-size: 0.95rem; }
        .project-card ul { list-style: none; margin-bottom: 20px; }
        .project-card li { position: relative; padding-left: 20px; margin-bottom: 8px; font-size: 0.95rem; color: var(--text); }
        .project-card li::before { content: '✓'; position: absolute; left: 0; color: var(--primary); font-weight: bold; }
        
        /* Placeholder for Screenshots */
        .placeholder-img {
            width: 100%;
            height: 180px;
            background-color: var(--placeholder-bg);
            border: 2px dashed var(--border);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: center;
            padding: 10px;
        }

        .tech-stack { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .tech-badge { background: #f1f5f9; color: var(--text-light); padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; font-family: monospace; }

        /* Skills */
        .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; text-align: center; }
